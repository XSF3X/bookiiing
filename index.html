<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام حجز الجداول</title><style>body{font-family:Tahoma,Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#17365d;color:#fff;border-radius:18px;padding:28px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#fff;border:1px solid #e0e5ee;border-radius:14px;padding:16px;box-shadow:0 3px 14px #00000008}.btn{display:block;text-decoration:none;background:#2563eb;color:#fff;padding:11px 13px;border-radius:9px;text-align:center;font-weight:700;margin-top:10px}.secondary{background:#eef2f7;color:#172033}.muted{color:#667085;font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.top-actions .btn{display:inline-block;min-width:190px}.pin-note{font-size:11px;color:#667085;margin-top:8px}</style></head><body><div class="wrap"><div class="hero"><h1>نظام حجز الجداول المدرسية</h1><p>اختر اسم المعلم. أول دخول: المعلم ينشئ الرمز السري الخاص به بنفسه.</p><div class="top-actions"><a class="btn secondary" href="reports.html">🖨️ طباعة الجداول</a><a class="btn secondary" href="reports.html?all=1">📋 الجدول العام للمعلمين</a></div></div><div class="card"><div id="teachers" class="grid"></div></div></div><script>const teachers=[['قرناس المطيري','3250aba8-6ee2-4a2c-8eb5-c472244880bb',20],['طلال الحربي','69066d36-3cf3-4a7e-b633-de2b67987620',20],['احمد منصور','ec8127d0-8c60-4299-89fa-9313a0d55244',19],['أسامة المفرج','8bf622ef-4fee-4192-bfa8-ca7d6f584924',20],['دبيان الفعيم','a9a02727-301b-4eb4-93bf-a858efc6b12c',18],['سطام','4bc64cc1-dc40-4e75-bab3-c76db2316db7',15],['محمد حجاب','7b3a4530-fb92-474b-a1ae-f114ea28d86b',20],['عبدالله السيف','c2552870-9ace-46e2-8de6-ff395fc9b61b',20],['سند صويان','55a905d9-e662-401c-b222-242b02d5b81e',20],['فهد صنيتان','6927316c-8089-4578-bc5c-ce82db7c2554',18],['صلاح المطيري','55da1221-69ce-44bb-ae47-a6f98143f4c5',18],['هابس','d33324c5-4154-472c-97f1-cd61ae9c5733',19],['سعود الشريف','5bad056b-0685-4826-9ee2-3b5b2ed915d0',19],['معلم فيزياء','682423c9-13fc-4649-a4c2-6e4bf0b1279a',9],['عبدالهادي المري','6c47f030-0320-4631-820f-7785a46ce5af',23],['زياد عسيري','0326bac6-8818-4e44-9721-af827e8d8bad',22]];document.getElementById('teachers').innerHTML=teachers.map(([n,id,r])=>`<div class="card"><h3>${n}</h3><div class="muted">المطلوب: ${r} حصة</div><a class="btn" href="login.html?teacher_id=${id}&teacher=${encodeURIComponent(n)}&v=20260825">دخول وحجز</a><a class="btn secondary" href="reports.html?teacher=${encodeURIComponent(n)}">🖨️ طباعة جدول المعلم</a><div class="pin-note">أول مرة: اختر الرمز السري بنفسك.</div></div>`).join('')</script></body></html>
