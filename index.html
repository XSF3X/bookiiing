<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام حجز الجداول</title><style>body{font-family:Tahoma,Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#17365d;color:#fff;border-radius:18px;padding:28px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#fff;border:1px solid #e0e5ee;border-radius:14px;padding:16px;box-shadow:0 3px 14px #00000008}.btn{display:block;text-decoration:none;background:#2563eb;color:#fff;padding:11px 13px;border-radius:9px;text-align:center;font-weight:700;margin-top:10px}.muted{color:#667085;font-size:13px}</style></head><body><div class="wrap"><div class="hero"><h1>نظام حجز الجداول المدرسية</h1><p>اختر اسم المعلم للدخول إلى صفحة الحجز الخاصة به.</p></div><div class="card"><div id="teachers" class="grid"></div></div></div><script>const teachers=[['قرناس المطيري',20],['طلال الحربي',20],['احمد منصور',19],['أسامة المفرج',20],['دبيان الفعيم',18],['سطام',15],['محمد حجاب',20],['عبدالله السيف',20],['سند صويان',20],['فهد صنيتان',18],['صلاح المطيري',18],['هابس',19],['سعود الشريف',19],['معلم فيزياء',9],['عبدالهادي المري',23],['زياد عسيري',22]];document.getElementById('teachers').innerHTML=teachers.map(([n,r])=>`<div class="card"><h3>${n}</h3><div class="muted">المطلوب: ${r} حصة</div><a class="btn" href="teacher.html?teacher=${encodeURIComponent(n)}">دخول</a></div>`).join('')</script></body></html>
