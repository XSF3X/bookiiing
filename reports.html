<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طباعة الجداول — حجز المدرسة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e1ec;--brand:#17365d;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#17365d,#28547f);color:#fff;border-radius:16px;padding:20px;margin-bottom:12px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#d9e6f3;font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}select,button{padding:10px;border-radius:9px;border:1px solid #cbd5e1}select{width:100%;background:#fff}button{background:var(--blue);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#eef2f7;color:var(--ink)}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}.teacher-table{min-width:950px}.teacher-table th,.teacher-table td{border:1px solid #333;padding:7px;text-align:center;font-size:11px}.teacher-table th{background:#eef3f8}.slot{height:48px;vertical-align:middle}.small{font-size:10px;color:#667085}.all-table{min-width:1300px}.all-table th,.all-table td{border:1px solid #333;padding:5px;text-align:center;font-size:9px}.all-table th{background:#eef3f8}.print-actions{margin-bottom:10px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
@media print{body{background:#fff}.no-print{display:none!important}.card{border:0;padding:0}.hero{display:none}.page-break{page-break-before:always}.teacher-table th,.teacher-table td{font-size:10px;padding:5px}.all-table th,.all-table td{font-size:7.5px;padding:3px}@page{size:A4 landscape;margin:8mm}}
</style>
</head>
<body><div class="wrap">
<div class="hero no-print"><h1>طباعة جداول المدرسة</h1><p>التقارير تُبنى مباشرة من الحجوزات المحفوظة في قاعدة البيانات.</p></div>
<div class="card no-print"><div class="grid">
<div><label>المعلم</label><select id="teacher"></select></div>
<div><label>نوع التقرير</label><select id="reportType"><option value="teacher">جدول معلم مستقل</option><option value="all">الجدول العام لجميع المعلمين</option></select></div>
<div><label>&nbsp;</label><button id="printBtn">طباعة التقرير</button></div>
</div><div class="row" style="margin-top:10px"><button class="secondary" id="refreshBtn">تحديث الحجوزات</button><button class="secondary" id="backBtn">العودة</button></div><div id="msg"></div></div>
<div class="card"><div id="preview"></div></div>
</div>
<script>
const SUPABASE_URL='https://yqbhxeotqbyygbntazws.supabase.co';
const SUPABASE_KEY='sb_publishable_1N-Q_hswv_veUAZkIUD3zw_iv4Z-C9e';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'];const PERIODS=7;let teachers=[],bookings=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function teacherTable(t){let h=`<h2>جدول المعلم — ${esc(t.name)}</h2><table class="teacher-table"><thead><tr><th>الحصة</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>`;for(let p=1;p<=7;p++){h+=`<tr><th>${p}</th>`;for(const d of DAYS){const xs=bookings.filter(b=>b.teacher_id===t.id&&b.day_name===d&&b.period===p&&b.status==='booked');h+=`<td class="slot">${xs.map(x=>`<b>${esc(x.subject||x.assignment?.subject||'')}</b><br><span class="small">${esc(x.class_name)}</span>`).join('<hr>')||'—'}</td>`}h+='</tr>'}return h+'</tbody></table>'}
function allTeachers(){let h='<h1>الجدول العام للمعلمين</h1><table class="all-table"><thead><tr><th>المعلم</th>';DAYS.forEach(d=>{for(let p=1;p<=7;p++)h+=`<th>${d}<br>${p}</th>`});h+='</tr></thead><tbody>';teachers.forEach(t=>{h+=`<tr><th>${esc(t.name)}</th>`;DAYS.forEach(d=>{for(let p=1;p<=7;p++){const xs=bookings.filter(b=>b.teacher_id===t.id&&b.day_name===d&&b.period===p&&b.status==='booked');h+=`<td>${xs.map(x=>`${esc(x.subject||x.assignment?.subject||'')}<br>${esc(x.class_name)}`).join('<hr>')||'—'}</td>`}});h+='</tr>'});return h+'</tbody></table>'}
function render(){const t=teachers.find(x=>x.id===$('teacher').value);$('preview').innerHTML=$('reportType').value==='all'?allTeachers():t?teacherTable(t):'<p>لم يتم اختيار معلم.</p>'}
async function load(){const [tr,br]=await Promise.all([sb.from('teachers').select('id,name,required_lessons').order('name'),sb.from('lesson_bookings').select('id,teacher_id,day_name,period,assignment_id,class_name,subject,status,assignment:assignment_id(subject)').eq('status','booked')]);if(tr.error||br.error){$('msg').innerHTML=`<div style="color:#b42318">تعذر تحميل البيانات.</div>`;return}teachers=tr.data||[];bookings=br.data||[];$('teacher').innerHTML=teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');const q=new URLSearchParams(location.search).get('teacher');if(q){const t=teachers.find(t=>t.name===q);if(t)$('teacher').value=t.id}$('reportType').value=new URLSearchParams(location.search).get('all')==='1'?'all':'teacher';render()}
function print(){const title=$('reportType').value==='all'?'الجدول العام للمعلمين':`جدول المعلم — ${$('teacher').selectedOptions[0]?.text||''}`;const body=$('preview').innerHTML;const w=window.open('','_blank');if(!w){alert('اسمح بالنوافذ المنبثقة للطباعة.');return}w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Tahoma,Arial,sans-serif;color:#111;padding:10px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #333;padding:5px;text-align:center}th{background:#eee}.teacher-table{min-width:950px}.teacher-table th,.teacher-table td{font-size:10px}.all-table th,.all-table td{font-size:7px;padding:3px}@page{size:A4 landscape;margin:7mm}.page-break{page-break-before:always}</style></head><body>${body}</body></html>`);w.document.close();setTimeout(()=>w.print(),250)}
$('teacher').onchange=render;$('reportType').onchange=render;$('refreshBtn').onclick=load;$('printBtn').onclick=print;$('backBtn').onclick=()=>location.href='index.html';load();
</script></body></html>
