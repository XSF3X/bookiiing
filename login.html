<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المعلم — حجز الجداول</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e1ec;--blue:#2563eb;--dark:#17365d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{max-width:520px;margin:40px auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000b}.hero{background:linear-gradient(135deg,#17365d,#28547f);color:#fff}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#dbe7f4;font-size:13px}.name{margin:14px 0;padding:14px;border-radius:10px;background:#f5f8fc;font-weight:900;font-size:20px}.mode{font-size:14px;margin:8px 0}.hint{font-size:12px;color:var(--muted);line-height:1.7}.pin{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;text-align:center;font-size:22px;margin:8px 0}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eef2f7;color:var(--ink);margin-top:8px}.dark{background:#17365d}.alert{padding:10px;border-radius:10px;margin-top:10px;line-height:1.6}.ok{background:#ecfdf3;color:#067647}.bad{background:#fef3f2;color:#b42318}.hidden{display:none!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:560px){.wrap{margin:10px auto}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card hero"><h1>دخول المعلم</h1><p>كل معلم له رمز سري مستقل. اختر الرمز بنفسك أول مرة، ثم استخدمه للدخول لاحقًا.</p></div><div class="card"><div id="name" class="name">—</div><div id="mode" class="mode">جاهز</div><div id="hint" class="hint">يمكنك استخدام أي رمز سري تريده: حرف واحد، رقم واحد، كلمة، أو خليط منها. لا يوجد حد لطوله.</div><input id="pin1" class="pin" type="password" autocomplete="current-password" placeholder="اكتب الرمز السري"><input id="pin2" class="pin hidden" type="password" autocomplete="new-password" placeholder="تأكيد الرمز السري"><div class="row"><button id="loginBtn" class="btn">دخول</button><button id="setupBtn" class="btn dark">أول دخول: إنشاء رمز</button></div><button id="back" class="btn secondary">العودة</button><div id="msg"></div></div></div><script>const URL='https://yqbhxeotqbyygbntazws.supabase.co',KEY='sb_publishable_1N-Q_hswv_veUAZkIUD3zw_iv4Z-C9e',sb=supabase.createClient(URL,KEY),q=new URLSearchParams(location.search),teacherId=q.get('teacher_id')||'',teacherName=q.get('teacher')||'المعلم',SESSION_KEY='teacher_session_'+teacherName;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));$('name').textContent=teacherName;function show(t,k='bad'){$('msg').innerHTML='<div class="alert '+k+'">'+esc(t)+'</div>'}function setBusy(b){$('loginBtn').disabled=b;$('setupBtn').disabled=b}function withTimeout(p,ms=10000){return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error('انتهت مهلة الاتصال بقاعدة البيانات. تحقق من الإنترنت ثم حاول مرة أخرى.')),ms))])}async function login(){const p=$('pin1').value;if(!teacherId){show('رابط المعلم غير صحيح. ارجع واختر المعلم من الصفحة الرئيسية.');return}if(!p){show('اكتب الرمز السري أولًا.');return}setBusy(true);try{const r=await withTimeout(sb.rpc('teacher_login',{p_teacher_id:teacherId,p_pin:p}));if(r.error||!r.data?.[0]?.ok)throw new Error(r.error?.message||r.data?.[0]?.message||'الرمز السري غير صحيح.');localStorage.setItem(SESSION_KEY,r.data[0].token);location.href='teacher.html?teacher='+encodeURIComponent(teacherName)+'&v=20260825'}catch(e){show(e?.message||'تعذر تسجيل الدخول.')}finally{setBusy(false)}}async function setup(){const p=$('pin1').value,c=$('pin2').value;if(!teacherId){show('رابط المعلم غير صحيح. ارجع واختر المعلم من الصفحة الرئيسية.');return}if(!p){show('اكتب الرمز الذي تريد إنشاءه.');return}if(p!==c){show('تأكيد الرمز غير مطابق.');return}setBusy(true);try{const r=await withTimeout(sb.rpc('teacher_set_initial_pin',{p_teacher_id:teacherId,p_pin:p}));if(r.error||!r.data?.[0]?.ok)throw new Error(r.error?.message||r.data?.[0]?.message||'تعذر إنشاء الرمز. ربما تم إنشاؤه مسبقًا لهذا المعلم.');show('تم إنشاء الرمز بنجاح. جارٍ الدخول…','ok');const l=await withTimeout(sb.rpc('teacher_login',{p_teacher_id:teacherId,p_pin:p}));if(l.error||!l.data?.[0]?.ok)throw new Error(l.error?.message||l.data?.[0]?.message||'تم إنشاء الرمز لكن تعذر تسجيل الدخول به.');localStorage.setItem(SESSION_KEY,l.data[0].token);location.href='teacher.html?teacher='+encodeURIComponent(teacherName)+'&v=20260825'}catch(e){show(e?.message||'تعذر إنشاء الرمز.')}finally{setBusy(false)}}function enableSetup(){ $('pin2').classList.remove('hidden');$('loginBtn').classList.add('hidden');$('setupBtn').textContent='إنشاء الرمز والدخول';$('mode').textContent='إنشاء رمز سري جديد';$('hint').textContent='اكتب أي رمز تريده ثم أعد كتابته للتأكيد. لا يوجد حد للطول ولا لنوع الرمز.';$('pin1').autocomplete='new-password';$('pin2').focus()}$('loginBtn').onclick=login;$('setupBtn').onclick=()=>{$('setupBtn').textContent==='إنشاء الرمز والدخول'?setup():enableSetup()};$('pin1').addEventListener('keydown',e=>{if(e.key==='Enter')($('pin2').classList.contains('hidden')?login():setup())});$('pin2').addEventListener('keydown',e=>{if(e.key==='Enter')setup()});$('back').onclick=()=>location.href='index.html';</script></body></html>
