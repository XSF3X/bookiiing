<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول المعلم — حجز الجداول</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e1ec;--blue:#2563eb;--dark:#17365d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:520px;margin:40px auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000b}
.hero{background:linear-gradient(135deg,#17365d,#28547f);color:#fff}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#dbe7f4;font-size:13px}
.name{margin:14px 0;padding:14px;border-radius:10px;background:#f5f8fc;font-weight:900;font-size:20px}.mode{font-size:14px;margin:8px 0}.hint{font-size:12px;color:var(--muted);line-height:1.7}
.pin{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;text-align:center;font-size:22px;margin:8px 0}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}
.secondary{background:#eef2f7;color:var(--ink);margin-top:8px}.dark{background:#17365d}.alert{padding:10px;border-radius:10px;margin-top:10px;line-height:1.6}.ok{background:#ecfdf3;color:#067647}.bad{background:#fef3f2;color:#b42318}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="card hero"><h1>دخول المعلم</h1><p id="heroText">جارٍ التحقق من حالة حساب المعلم…</p></div>
  <div class="card">
    <div id="name" class="name">جاري تحديد المعلم…</div>
    <div id="mode" class="mode">جارٍ التحقق…</div>
    <div id="hint" class="hint"></div>
    <input id="pin1" class="pin" type="password" autocomplete="current-password" placeholder="اكتب الرمز السري">
    <input id="pin2" class="pin hidden" type="password" autocomplete="new-password" placeholder="تأكيد الرمز السري">
    <button id="loginBtn" class="btn">دخول</button>
    <button id="setupBtn" class="btn dark hidden">إنشاء الرمز والدخول</button>
    <button id="back" class="btn secondary">العودة</button>
    <div id="msg"></div>
  </div>
</div>
<script>
const SUPABASE_URL='https://yqbhxeotqbyygbntazws.supabase.co';
const SUPABASE_KEY='sb_publishable_1N-Q_hswv_veUAZkIUD3zw_iv4Z-C9e';
const q=new URLSearchParams(location.search);
const teacherId=q.get('teacher_id')||'';
const teacherName=q.get('teacher')||'المعلم';
const SESSION_KEY='teacher_session_'+teacherName;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function show(t,k='bad'){$('msg').innerHTML='<div class="alert '+k+'">'+esc(t)+'</div>'}
function setBusy(b){$('loginBtn').disabled=b;$('setupBtn').disabled=b}
function headers(){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Accept':'application/json'}}
async function api(path,opts={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const r=await fetch(SUPABASE_URL+path,{...opts,headers:{...headers(),...(opts.headers||{})},signal:controller.signal,cache:'no-store'});
    const text=await r.text();
    let data=null;try{data=text?JSON.parse(text):null}catch{}
    if(!r.ok){
      const detail=data?.message||data?.error_description||data?.hint||data?.details||text||('HTTP '+r.status);
      throw new Error(detail);
    }
    return data;
  }catch(e){
    if(e.name==='AbortError')throw new Error('انتهت مهلة الاتصال بقاعدة البيانات.');
    throw e;
  }finally{clearTimeout(timer)}
}
async function hasPin(){
  // لا نقرأ قيمة الرمز نفسها؛ نتحقق فقط من وجود hash للمعلم.
  const data=await api('/rest/v1/teachers?select=id&pin_hash=not.is.null&id=eq.'+encodeURIComponent(teacherId)+'&limit=1');
  return Array.isArray(data)&&data.length>0;
}
function goToSite(token){
  localStorage.setItem(SESSION_KEY,token);
  const v=Date.now();
  location.replace('teacher.html?teacher='+encodeURIComponent(teacherName)+'&teacher_id='+encodeURIComponent(teacherId)+'&v='+v);
}
async function login(){
  const p=$('pin1').value;
  if(!teacherId)return show('رابط المعلم غير صحيح. ارجع واختر المعلم من الصفحة الرئيسية.');
  if(!p)return show('اكتب الرمز السري أولًا.');
  setBusy(true);
  try{
    const data=await api('/rest/v1/rpc/teacher_login',{method:'POST',body:JSON.stringify({p_teacher_id:teacherId,p_pin:p})});
    const row=Array.isArray(data)?data[0]:data;
    if(!row?.ok)throw new Error(row?.message||'الرمز السري غير صحيح.');
    goToSite(row.token);
  }catch(e){show(e.message||'تعذر تسجيل الدخول.')}finally{setBusy(false)}
}
async function setup(){
  const p=$('pin1').value,c=$('pin2').value;
  if(!teacherId)return show('رابط المعلم غير صحيح. ارجع واختر المعلم من الصفحة الرئيسية.');
  if(!p)return show('اكتب الرمز الذي تريد إنشاءه.');
  if(p!==c)return show('تأكيد الرمز غير مطابق.');
  setBusy(true);
  try{
    const data=await api('/rest/v1/rpc/teacher_set_initial_pin',{method:'POST',body:JSON.stringify({p_teacher_id:teacherId,p_pin:p})});
    const row=Array.isArray(data)?data[0]:data;
    if(!row?.ok)throw new Error(row?.message||'تعذر إنشاء الرمز. ربما تم إنشاؤه مسبقًا لهذا المعلم.');
    const loginData=await api('/rest/v1/rpc/teacher_login',{method:'POST',body:JSON.stringify({p_teacher_id:teacherId,p_pin:p})});
    const loginRow=Array.isArray(loginData)?loginData[0]:loginData;
    if(!loginRow?.ok)throw new Error(loginRow?.message||'تم إنشاء الرمز لكن تعذر الدخول به.');
    goToSite(loginRow.token);
  }catch(e){show(e.message||'تعذر إنشاء الرمز.')}finally{setBusy(false)}
}
function enableSetup(){
  $('pin2').classList.remove('hidden');
  $('loginBtn').classList.add('hidden');
  $('setupBtn').classList.remove('hidden');
  $('mode').textContent='أول دخول — إنشاء رمز سري';
  $('heroText').textContent='أنشئ رمزك السري مرة واحدة، وبعدها سيكون الدخول بالرمز مباشرة.';
  $('hint').textContent='اكتب الرمز الذي تريده ثم أكده. لا يوجد حد لطول الرمز.';
  $('pin1').autocomplete='new-password';
  $('pin1').focus();
}
async function openTeacher(){
  $('name').textContent=teacherName;
  if(!teacherId){$('mode').textContent='تعذر تحديد المعلم';$('hint').textContent='ارجع للصفحة الرئيسية واختر اسم المعلم من هناك.';$('loginBtn').disabled=true;return}
  try{
    const exists=await hasPin();
    if(exists){
      $('mode').textContent='أدخل الرمز السري للدخول';
      $('heroText').textContent='اكتب رمزك السري وسيتم إدخالك مباشرة إلى جدولك.';
      $('hint').textContent='هذا المعلم لديه رمز سري مسبقًا.';
      $('pin1').focus();
    }else{
      enableSetup();
    }
  }catch(e){
    // إذا كان استعلام الحالة غير متاح، لا نمنع الدخول؛ نعرض مسار الدخول المعتاد.
    $('mode').textContent='أدخل الرمز السري';
    $('heroText').textContent='اكتب الرمز السري للدخول إلى جدولك.';
    $('hint').textContent='إذا كان هذا أول دخول، استخدم خيار إنشاء الرمز.';
    $('loginBtn').classList.remove('hidden');
    $('setupBtn').classList.remove('hidden');
    $('setupBtn').textContent='أول دخول: إنشاء رمز';
    $('setupBtn').onclick=enableSetup;
    $('pin1').focus();
  }
}
$('loginBtn').onclick=login;
$('setupBtn').onclick=setup;
$('pin1').addEventListener('keydown',e=>{if(e.key==='Enter')($('pin2').classList.contains('hidden')?login():setup())});
$('pin2').addEventListener('keydown',e=>{if(e.key==='Enter')setup()});
$('back').onclick=()=>location.replace('index.html');
openTeacher();
</script>
</body>
</html>
