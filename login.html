<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المعلم — حجز الجداول</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e1ec;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{max-width:520px;margin:50px auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000b}.hero{background:linear-gradient(135deg,#17365d,#28547f);color:#fff}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#dbe7f4;font-size:13px}.name{margin:14px 0;padding:12px;border-radius:10px;background:#f5f8fc;font-weight:800}.mode{font-size:14px;margin-bottom:8px}.hint{font-size:12px;color:var(--muted);line-height:1.7}.pin{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;text-align:center;font-size:22px;margin:8px 0}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eef2f7;color:var(--ink);margin-top:8px}.alert{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#ecfdf3;color:#067647}.bad{background:#fef3f2;color:#b42318}.hidden{display:none!important}@media(max-width:560px){.wrap{margin:10px auto}}</style></head><body><div class="wrap"><div class="card hero"><h1>دخول المعلم</h1><p>كل معلم ينشئ الرمز السري بنفسه في أول دخول، ثم يستخدمه لاحقًا للدخول إلى جدوله.</p></div><div class="card"><div id="name" class="name">جاري تحميل اسم المعلم…</div><div id="mode" class="mode">جارٍ الاتصال بقاعدة البيانات…</div><div id="hint" class="hint"></div><input id="pin1" class="pin" type="password" autocomplete="new-password" placeholder="اكتب أي رمز سري تريده"><input id="pin2" class="pin hidden" type="password" autocomplete="new-password" placeholder="تأكيد الرمز السري"><button id="go" class="btn">متابعة</button><button id="back" class="btn secondary">العودة</button><div id="msg"></div></div></div><script>const URL='https://yqbhxeotqbyygbntazws.supabase.co',KEY='sb_publishable_1N-Q_hswv_veUAZkIUD3zw_iv4Z-C9e',sb=supabase.createClient(URL,KEY),nameQ=new URLSearchParams(location.search).get('teacher')||'',SESSION_KEY='teacher_session_'+nameQ;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let teacher=null,first=false;function show(t,k='bad'){$('msg').innerHTML='<div class="alert '+k+'">'+esc(t)+'</div>'}async function setup(){if(!nameQ){show('رابط المعلم لا يحتوي على اسم المعلم.');return}try{$('mode').textContent='جارٍ تحميل بيانات المعلم…';const {data,error}=await sb.from('teachers').select('id,name').eq('name',nameQ).maybeSingle();if(error)throw error;if(!data){show('لم يتم العثور على المعلم.');return}teacher=data;$('name').textContent=data.name;const st=await sb.rpc('teacher_pin_status',{p_teacher_id:data.id});if(st.error)throw st.error;first=!st.data?.[0]?.initialized;if(first){$('mode').textContent='أول دخول — اختر الرمز السري بنفسك';$('hint').textContent='لا يوجد طول أو نوع محدد: يمكنك وضع حرف واحد، رقم واحد، أو أي كلمة/رمز تريده.';$('pin2').classList.remove('hidden');$('go').textContent='إنشاء الرمز والدخول';$('pin1').autocomplete='new-password'}else{$('mode').textContent='تسجيل الدخول';$('hint').textContent='أدخل الرمز السري الذي أنشأته سابقًا.';$('pin2').classList.add('hidden');$('go').textContent='دخول';$('pin1').autocomplete='current-password'}}catch(e){show(e?.message||'تعذر الاتصال بقاعدة البيانات.','bad')}}async function go(){const p=$('pin1').value;if(!p){show('اكتب الرمز السري أولًا.');return}if(first){const p2=$('pin2').value;if(p!==p2){show('الرمزان غير متطابقين.');return}const r=await sb.rpc('teacher_set_initial_pin',{p_teacher_id:teacher.id,p_pin:p});if(r.error||!r.data?.[0]?.ok){show(r.error?.message||r.data?.[0]?.message||'تعذر إنشاء الرمز السري.');return}}const r=await sb.rpc('teacher_login',{p_teacher_id:teacher.id,p_pin:p});if(r.error||!r.data?.[0]?.ok){show(r.error?.message||r.data?.[0]?.message||'الرمز السري غير صحيح.');return}localStorage.setItem(SESSION_KEY,r.data[0].token);location.href='teacher.html?teacher='+encodeURIComponent(teacher.name)+'&v=20260825'}$('go').onclick=go;$('pin1').addEventListener('keydown',e=>{if(e.key==='Enter')go()});$('pin2').addEventListener('keydown',e=>{if(e.key==='Enter')go()});$('back').onclick=()=>location.href='index.html';setup();</script></body></html>
