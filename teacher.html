<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجز حصص المعلم</title><style>body{font-family:Tahoma,Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e0e5ee;border-radius:14px;padding:16px;margin:12px 0}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#a15c00}.bad{background:#fef3f2;color:#b42318}.alert{padding:10px;border-radius:9px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{font-size:26px;font-weight:900}.muted{font-size:12px;color:#667085}table{width:100%;border-collapse:collapse;font-size:12px;min-width:800px}th,td{border:1px solid #dfe5ee;padding:7px;text-align:center}th{background:#eef3f8}button,select{padding:9px;border:1px solid #cbd5e1;border-radius:8px}button{background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.free{background:#ecfdf3}.mine{background:#dbeafe}.booked{background:#fee2e2;color:#991b1b}.fixed{background:#eef2f7;color:#667085}.scroll{overflow:auto}</style></head><body><div class="wrap"><div class="card"><h1 id="name"></h1><div id="meta"></div></div><div class="stats"><div class="card"><div class="stat" id="required">-</div><div class="muted">المطلوب</div></div><div class="card"><div class="stat" id="booked">0</div><div class="muted">المحجوز</div></div><div class="card"><div class="stat" id="remaining">-</div><div class="muted">المتبقي</div></div></div><div id="message"></div><div class="card"><div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="assignment"></select><button id="bookBtn">حجز الخانة المحددة</button><button id="releaseBtn">إلغاء حجزك</button></div></div><div class="card"><div class="scroll"><table><thead><tr><th>الحصة</th><th>الأحد</th><th>الإثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th></tr></thead><tbody id="grid"></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://yqbhxeotqbyygbntazws.supabase.co';const SUPABASE_KEY='sb_publishable_1N-Q_hswv_veUAZkIUD3zw_iv4Z-C9e';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const DATA={days:['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'],periods:7,teachers:{'قرناس المطيري':{required:20,assignments:[['رابع','رياضيات',6],['خامس','رياضيات',6],['سادس','رياضيات',6],['سادس','نشاط',2]],goldDay:'الأربعاء',special:{'الخميس':[1,7]}},'طلال الحربي':{required:20},'احمد منصور':{required:19},'أسامة المفرج':{required:20},'دبيان الفعيم':{required:18},'سطام':{required:15},'محمد حجاب':{required:20},'عبدالله السيف':{required:20},'سند صويان':{required:20},'فهد صنيتان':{required:18},'صلاح المطيري':{required:18},'هابس':{required:19},'سعود الشريف':{required:19},'معلم فيزياء':{required:9},'عبدالهادي المري':{required:23},'زياد عسيري':{required:22}}};const params=new URLSearchParams(location.search);const teacher=params.get('teacher')||'قرناس المطيري';const t=DATA.teachers[teacher]||{required:0,assignments:[]};document.getElementById('name').textContent=teacher;document.getElementById('meta').innerHTML=t.goldDay?`⭐ اليوم الذهبي: ${t.goldDay} — الخميس: الأولى والسابعة فقط`:'اختر حصة ثم اختر الإسناد.';document.getElementById('required').textContent=t.required;const assignments=(t.assignments||[]).map((x,i)=>({id:String(i+1),className:x[0],subject:x[1],required:x[2]}));document.getElementById('assignment').innerHTML=assignments.map(a=>`<option value="${a.id}">${a.subject} — ${a.className} (${a.required})</option>`).join('')||'<option value="">لا توجد إسنادات</option>';
let selected=null;let bookings=[];let teacherId=null;const days=DATA.days;
function msg(text,kind='ok'){document.getElementById('message').innerHTML=`<div class="alert ${kind}">${text}</div>`}
async function load(){const q=await sb.from('teachers').select('id,name,required_lessons,gold_day,gold_last_period').eq('name',teacher).maybeSingle();if(q.error){msg('تعذر الاتصال بقاعدة الحجوزات: '+q.error.message,'bad');return}if(q.data)teacherId=q.data.id;const b=await sb.from('lesson_bookings').select('id,teacher_id,day_name,period,assignment_id,status,teacher:teacher_id(name)').eq('status','booked');if(!b.error)bookings=b.data||[];draw();}
function cellState(day,p){if(teacher==='قرناس المطيري'&&day==='الخميس'&&!([1,7].includes(p)))return 'fixed';const b=bookings.find(x=>x.day_name===day&&x.period===p);if(!b)return 'free';if(b.teacher_id===teacherId)return 'mine';return 'booked';}
function draw(){const tbody=document.getElementById('grid');tbody.innerHTML=Array.from({length:7},(_,i)=>{const p=i+1;return `<tr><th>${p}</th>`+days.map(d=>{const st=cellState(d,p);const b=bookings.find(x=>x.day_name===d&&x.period===p);let text='متاح';if(st==='mine')text='حجزك';else if(st==='booked')text=`محجوز — ${b?.teacher?.name||'معلم'}`;else if(st==='fixed')text='ممنوع';return `<td class="${st}" data-day="${d}" data-period="${p}" style="cursor:${st==='free'||st==='mine'?'pointer':'not-allowed'}">${text}</td>`}).join('')}</tr>`}).join('');tbody.querySelectorAll('td').forEach(td=>td.onclick=()=>{if(['free','mine'].includes(td.className)){selected={day:td.dataset.day,period:+td.dataset.period};tbody.querySelectorAll('td').forEach(x=>x.style.outline='none');td.style.outline='3px solid #2563eb'}});document.getElementById('booked').textContent=bookings.filter(x=>x.teacher_id===teacherId).length;document.getElementById('remaining').textContent=Math.max(0,t.required-bookings.filter(x=>x.teacher_id===teacherId).length)}
async function book(){if(!selected)return msg('اختر خانة أولًا.','warn');if(teacher==='قرناس المطيري'&&selected.day==='الخميس'&&!([1,7].includes(selected.period)))return msg('الخميس لقرناس: الأولى والسابعة فقط.','bad');if(bookings.some(x=>x.day_name===selected.day&&x.period===selected.period))return msg('هذه الخانة محجوزة بالفعل.','bad');if(!teacherId)return msg('المعلم غير مضاف في قاعدة البيانات بعد.','bad');const aid=document.getElementById('assignment').value;const ins=await sb.from('lesson_bookings').insert({teacher_id:teacherId,day_name:selected.day,period:selected.period,assignment_id:aid});if(ins.error)return msg('لم يتم الحجز: '+ins.error.message,'bad');msg('تم الحجز بنجاح ✅');selected=null;await load()}
async function release(){if(!selected)return msg('اختر خانة من حجوزاتك أولًا.','warn');const d=selected.day,p=selected.period;const b=bookings.find(x=>x.teacher_id===teacherId&&x.day_name===d&&x.period===p);if(!b)return msg('هذه الخانة ليست محجوزة لك.','warn');const del=await sb.from('lesson_bookings').delete().eq('id',b.id);if(del.error)return msg('تعذر الإلغاء: '+del.error.message,'bad');msg('تم إلغاء الحجز.');selected=null;await load()}
document.getElementById('bookBtn').onclick=book;document.getElementById('releaseBtn').onclick=release;load();</script></body></html>
