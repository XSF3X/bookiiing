<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجز جدول المعلم</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e1ec;--blue:#2563eb;--green:#067647;--red:#b42318;--gold:#805d00;--dark:#17365d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px #00000008}.hero{background:linear-gradient(135deg,#17365d,#28547f);color:#fff}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#dbe7f4;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{font-size:28px;font-weight:900}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#edf2ff;color:#2444a3;font-size:11px}.ok{background:#ecfdf3;color:var(--green)}.bad{background:#fef3f2;color:var(--red)}.gold{background:#fff3bf;color:var(--gold)}button,select{font:inherit}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eef2f7;color:var(--ink)}.danger{background:#fee2e2;color:#991b1b}.select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;min-width:320px}.alert{padding:10px;border-radius:10px;margin-top:8px;font-size:13px;line-height:1.6}.alert.ok{background:#ecfdf3;color:var(--green)}.alert.bad{background:#fef3f2;color:var(--red)}.alert.warn{background:#fffaeb;color:#a15c00}.assignments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.a{border:1px solid var(--line);border-radius:10px;padding:10px}.a strong{display:block}.progress{height:8px;background:#e8edf4;border-radius:99px;overflow:hidden;margin-top:6px}.progress span{display:block;height:100%;background:#2563eb}.scroll{overflow:auto}.schedule{width:100%;min-width:1000px;border-collapse:collapse;font-size:12px}.schedule th,.schedule td{border:1px solid var(--line);padding:6px;text-align:center}.schedule th{background:#eef3f8}.slot{height:118px;vertical-align:top;cursor:pointer}.available{background:#ecfdf3}.mine{background:#e0e7ff}.fixed{background:#eef2f7;cursor:not-allowed}.selected{outline:3px solid #2563eb;outline-offset:-3px}.slot-head{display:flex;justify-content:space-between;font-size:10px;font-weight:800}.count{padding:2px 5px;border-radius:99px;background:#fff;border:1px solid var(--line)}.cell-list{margin-top:6px;display:grid;gap:3px;text-align:right}.cell-item{background:#fff;border:1px solid #dfe5ee;border-radius:6px;padding:4px;line-height:1.35}.cell-item.mine{background:#eef2ff;border-color:#b9c7ff}.small{font-size:10px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr 1fr}.assignments{grid-template-columns:1fr 1fr}}@media(max-width:560px){.stats{gap:6px}.stat{font-size:22px}.assignments{grid-template-columns:1fr}.select{min-width:240px}}
</style></head>
<body>
<div id="app" class="wrap"><div class="card hero"><div class="row"><div style="flex:1"><h1 id="teacherName">جاري التحميل…</h1><p id="teacherMeta">—</p></div><div class="row"><span id="status" class="pill">جارٍ الاتصال</span><button id="logout" class="btn secondary">تسجيل خروج</button><button id="back" class="btn secondary">العودة للمعلمين</button></div></div></div>
<div class="stats"><div class="card"><div id="required" class="stat">—</div><div class="muted">المطلوب للمعلم</div></div><div class="card"><div id="booked" class="stat">—</div><div class="muted">المحجوز</div></div><div class="card"><div id="remaining" class="stat">—</div><div class="muted">المتبقي</div></div></div>
<div class="card"><h3>التوزيع المطلوب</h3><div id="assignments" class="assignments"></div></div>
<div class="card"><div class="row"><select id="assignment" class="select"></select><button id="save" class="btn primary">حجز الخانة المحددة</button><button id="cancel" class="btn danger" disabled>إلغاء الحجز المحدد</button><span id="selectedText" class="muted">اختر خانة لإضافة حصة، أو اضغط على إحدى حصصك لتعديلها/إلغائها.</span></div><div id="message"></div></div>
<div class="card"><div class="row"><h3 style="margin:0">جدول المدرسة الحي</h3><span class="muted">كل مربع = يوم + حصة، ويستوعب حتى 9 فصول مختلفة.</span></div><div class="scroll"><table class="schedule"><thead><tr><th>الحصة</th><th>الأحد</th><th>الإثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th></tr></thead><tbody id="grid"></tbody></table></div></div></div>
<script>
const SUPABASE_URL='https://yqbhxeotqbyygbntazws.supabase.co',SUPABASE_KEY='sb_publishable_1N-Q_hswv_veUAZkIUD3zw_iv4Z-C9e';
const qs=new URLSearchParams(location.search),teacherId=qs.get('teacher_id')||'',teacherName=qs.get('teacher')||'',SESSION_KEY='teacher_session_'+teacherName;
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'];let teacher=null,assignments=[],bookings=[],selected=null,token=localStorage.getItem(SESSION_KEY),timer=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const notify=(t,k='ok')=>$('message').innerHTML='<div class="alert '+k+'">'+esc(t)+'</div>';
function url(path){return SUPABASE_URL+path+(path.includes('?')?'&':'?')+'apikey='+encodeURIComponent(SUPABASE_KEY)}
async function api(path,opt={}){const c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url(path),{...opt,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Accept':'application/json',...(opt.headers||{})},signal:c.signal,cache:'no-store'});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}if(!r.ok)throw new Error(data?.message||data?.error_description||data?.hint||data?.details||text||('HTTP '+r.status));return data}catch(e){if(e.name==='AbortError')throw new Error('انتهت مهلة الاتصال بقاعدة البيانات.');throw e}finally{clearTimeout(tm)}}
const rpc=(name,body)=>api('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(body)});
async function loadTeacher(){const d=await api('/rest/v1/teachers?select=id,name,required_lessons,gold_day,gold_last_period&id=eq.'+encodeURIComponent(teacherId)+'&limit=1');if(!d?.[0])throw new Error('لم يتم العثور على المعلم.');return d[0]}
async function verify(){if(!token) return false;const d=await rpc('teacher_session_info',{p_token:token});const r=Array.isArray(d)?d[0]:d;return !!(r?.ok&&r.teacher_id===teacher.id)}
async function loadData(){const a=await api('/rest/v1/teacher_assignments?select=id,teacher_id,class_name,subject,required_lessons&teacher_id=eq.'+encodeURIComponent(teacher.id)+'&order=class_name.asc,subject.asc');const b=await api('/rest/v1/lesson_bookings?select=id,teacher_id,day_name,period,assignment_id,class_name,status,teacher:teacher_id(name),assignment:assignment_id(subject,class_name)&status=eq.booked');assignments=a||[];bookings=b||[];render();$('status').textContent='متصل';$('status').className='pill pill ok'}
function mine(){return bookings.filter(b=>b.teacher_id===teacher.id&&b.status==='booked')}
function chosen(){return assignments.find(a=>String(a.id)===String($('assignment').value))}
function ownAt(d,p){return bookings.find(b=>b.teacher_id===teacher.id&&b.day_name===d&&b.period===p&&b.status==='booked')}
function classAt(d,p,c,ignore){return bookings.find(b=>b.day_name===d&&b.period===p&&b.class_name===c&&b.status==='booked'&&b.id!==ignore)}
function fixed(d,p){return teacher?.name==='قرناس المطيري'&&d==='الخميس'&&!([1,7].includes(p))}
function render(){const me=mine(),counts={};me.forEach(b=>counts[b.assignment_id]=(counts[b.assignment_id]||0)+1);$('teacherName').textContent=teacher.name;$('teacherMeta').innerHTML='النصاب: <b>'+teacher.required_lessons+'</b> حصة '+(teacher.gold_day?'<span class="pill gold">⭐ اليوم الذهبي: '+esc(teacher.gold_day)+'</span>':'')+(teacher.name==='قرناس المطيري'?'<span class="pill gold">الخميس: الأولى والسابعة فقط</span>':'');$('required').textContent=teacher.required_lessons;$('booked').textContent=me.length;$('remaining').textContent=Math.max(0,teacher.required_lessons-me.length);const prev=$('assignment').value;$('assignments').innerHTML=assignments.map(a=>'<div class="a"><strong>'+esc(a.subject)+' — '+esc(a.class_name)+'</strong><span class="muted">'+(counts[a.id]||0)+' / '+a.required_lessons+'</span><div class="progress"><span style="width:'+Math.min(100,Math.round((counts[a.id]||0)/Math.max(1,a.required_lessons)*100))+'%"></span></div></div>').join('')||'<div class="muted">لا توجد إسنادات.</div>';$('assignment').innerHTML=assignments.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.subject)+' — '+esc(a.class_name)+' ('+(counts[a.id]||0)+'/'+a.required_lessons+')</option>').join('')||'<option>لا توجد إسنادات</option>';if(assignments.some(a=>String(a.id)===String(prev)))$('assignment').value=prev;const own=selected?.bookingId?bookings.find(b=>b.id===selected.bookingId&&b.teacher_id===teacher.id):null;if(own)$('assignment').value=own.assignment_id;$('save').textContent=own?'حفظ تعديل الحجز':'حجز الخانة المحددة';$('cancel').disabled=!own;
let html='';for(let p=1;p<=7;p++){html+='<tr><th>'+p+'</th>';for(const d of DAYS){const ownHere=ownAt(d,p), a=chosen(), conflict=a?classAt(d,p,a.class_name,ownHere?.id):null,all=bookings.filter(b=>b.day_name===d&&b.period===p&&b.status==='booked'),isSel=selected&&selected.day===d&&selected.period===p,cl=fixed(d,p)?'fixed':ownHere?'mine':'available';let s=fixed(d,p)?'ممنوع':ownHere?'لديك حصة':conflict?'الفصل المحدد محجوز':'متاح';let txt='<div class="slot-head"><span>'+s+'</span><span class="count">'+all.length+'/9</span></div>';if(all.length)txt+='<div class="cell-list">'+all.map(b=>'<div class="cell-item '+(b.teacher_id===teacher.id?'mine':'')+'"><b>'+esc(b.class_name)+'</b> — '+esc(b.assignment?.subject||'')+'<br><span class="small">'+esc(b.teacher?.name||'')+'</span></div>').join('')+'</div>';else if(!fixed(d,p))txt+='<div class="small">اضغط لإضافة حصة</div>';html+='<td class="slot '+cl+(isSel?' selected':'')+'" data-day="'+esc(d)+'" data-period="'+p+'">'+txt+'</td>'}html+='</tr>'}$('grid').innerHTML=html;$('grid').querySelectorAll('td').forEach(td=>td.onclick=()=>selectSlot(td.dataset.day,Number(td.dataset.period)))}
function selectSlot(d,p){if(fixed(d,p))return notify('هذه الخانة ممنوعة حسب قواعد المعلم.','warn');const own=ownAt(d,p);if(own){selected={day:d,period:p,bookingId:own.id};$('assignment').value=own.assignment_id;$('selectedText').textContent='تم تحديد حجزك: '+d+' — الحصة '+p;render();return}const a=chosen();if(a&&classAt(d,p,a.class_name,null))return notify('الفصل المحدد محجوز هنا. اختر إسنادًا لفصل آخر.','warn');if(bookings.filter(b=>b.day_name===d&&b.period===p&&b.status==='booked').length>=9)return notify('اكتملت الخانة: 9 فصول محجوزة.','warn');selected={day:d,period:p};$('selectedText').textContent='المحدد: '+d+' — الحصة '+p;render()}
async function save(){if(!selected)return notify('اختر خانة أولًا.','warn');const a=chosen();if(!a)return notify('اختر إسنادًا أولًا.','warn');try{let d;if(selected.bookingId)d=await rpc('move_lesson',{p_token:token,p_booking_id:selected.bookingId,p_day:selected.day,p_period:selected.period,p_assignment_id:a.id});else d=await rpc('book_lesson',{p_token:token,p_day:selected.day,p_period:selected.period,p_assignment_id:a.id});const r=Array.isArray(d)?d[0]:d;if(!r?.ok)throw new Error(r?.message||'تعذر حفظ الحجز.');notify(selected.bookingId?'تم تعديل الحجز.':'تمت إضافة الحصة داخل الخانة.');selected=null;await loadData()}catch(e){notify(e.message||'تعذر حفظ الحجز.','bad')}}
async function cancel(){if(!selected?.bookingId)return notify('حدد إحدى حصصك أولًا.','warn');try{const d=await rpc('cancel_lesson',{p_token:token,p_booking_id:selected.bookingId}),r=Array.isArray(d)?d[0]:d;if(!r?.ok)throw new Error(r?.message||'تعذر الإلغاء.');selected=null;notify('تم إلغاء الحجز.');await loadData()}catch(e){notify(e.message||'تعذر الإلغاء.','bad')}}
async function logout(){try{if(token)await rpc('teacher_logout',{p_token:token})}catch{}localStorage.removeItem(SESSION_KEY);location.replace('index.html')}
(async()=>{try{if(!teacherId){location.replace('index.html');return}teacher=await loadTeacher();if(!(await verify())){localStorage.removeItem(SESSION_KEY);location.replace('login.html?teacher='+encodeURIComponent(teacherName)+'&teacher_id='+encodeURIComponent(teacher.id)+'&v='+Date.now());return}await loadData();timer=setInterval(()=>loadData().catch(e=>notify(e.message||'تعذر تحديث الجدول.','bad')),5000)}catch(e){$('status').textContent='خطأ';$('status').className='pill bad';notify(e.message||'تعذر تحميل الجدول.','bad')}})();
$('save').onclick=save;$('cancel').onclick=cancel;$('logout').onclick=logout;$('back').onclick=()=>location.replace('index.html');
</script></body></html>
