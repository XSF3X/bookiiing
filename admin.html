<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><style>body{font-family:Tahoma,Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1300px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e0e5ee;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{font-size:26px;font-weight:900}.muted{font-size:12px;color:#667085}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #dfe5ee;padding:7px;text-align:center}th{background:#eef3f8}.ok{color:#067647}.warn{color:#a15c00}.bad{color:#b42318}.alert{padding:10px;border-radius:9px;margin:7px 0}</style></head><body><div class="wrap"><div class="card"><h1>لوحة إدارة حجز الجداول</h1><p class="muted">تعرض حالة الحجوزات من Supabase مباشرة.</p></div><div id="stats" class="grid"></div><div class="card"><h2>حالة المعلمين</h2><table><thead><tr><th>المعلم</th><th>المطلوب</th><th>المحجوز</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card"><h2>آخر الحجوزات</h2><table><thead><tr><th>المعلم</th><th>اليوم</th><th>الحصة</th><th>الحالة</th></tr></thead><tbody id="latest"></tbody></table></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yqbhxeotqbyygbntazws.supabase.co','sb_publishable_1N-Q_hswv_veUAZkIUD3zw_iv4Z-C9e');const names={'قرناس المطيري':20,'طلال الحربي':20,'احمد منصور':19,'أسامة المفرج':20,'دبيان الفعيم':18,'سطام':15,'محمد حجاب':20,'عبدالله السيف':20,'سند صويان':20,'فهد صنيتان':18,'صلاح المطيري':18,'هابس':19,'سعود الشريف':19,'معلم فيزياء':9,'عبدالهادي المري':23,'زياد عسيري':22};async function load(){const q=await sb.from('teachers').select('id,name,required_lessons');if(q.error){document.getElementById('rows').innerHTML=`<tr><td colspan="5" class="bad">${q.error.message}</td></tr>`;return}const b=await sb.from('lesson_bookings').select('id,teacher_id,day_name,period,status,created_at,teacher:teacher_id(name)').eq('status','booked').order('created_at',{ascending:false});if(b.error){document.getElementById('latest').innerHTML=`<tr><td colspan="4" class="bad">${b.error.message}</td></tr>`;return}const teachers=q.data||[];const bookings=b.data||[];const rows=teachers.map(t=>({name:t.name,required:t.required_lessons,booked:bookings.filter(x=>x.teacher_id===t.id).length}));const totalReq=rows.reduce((a,x)=>a+x.required,0),totalBooked=bookings.length,done=rows.filter(x=>x.booked===x.required).length;document.getElementById('stats').innerHTML=`<div class="card"><div class="stat">${rows.length}</div><div class="muted">المعلمون</div></div><div class="card"><div class="stat">${totalReq}</div><div class="muted">إجمالي المطلوب</div></div><div class="card"><div class="stat">${totalBooked}</div><div class="muted">إجمالي المحجوز</div></div><div class="card"><div class="stat">${done}</div><div class="muted">مكتملون</div></div>`;document.getElementById('rows').innerHTML=rows.map(x=>`<tr><td>${x.name}</td><td>${x.required}</td><td>${x.booked}</td><td>${Math.max(0,x.required-x.booked)}</td><td>${x.booked===x.required?'<span class="ok">مكتمل</span>':'<span class="warn">ناقص</span>'}</td></tr>`).join('');document.getElementById('latest').innerHTML=bookings.slice(0,50).map(x=>`<tr><td>${x.teacher?.name||'-'}</td><td>${x.day_name}</td><td>${x.period}</td><td class="ok">محجوز</td></tr>`).join('')||'<tr><td colspan="4">لا توجد حجوزات</td></tr>'}load();setInterval(load,5000);</script></body></html>
