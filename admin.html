<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة — حجز الجداول</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1400px;margin:auto;padding:18px}.hero,.card{background:#fff;border:1px solid #d9e1ec;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #00000008}.hero{background:linear-gradient(135deg,#17365d,#28547f);color:#fff}.hero p{color:#d9e6f3}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{font-size:28px;font-weight:900}.muted{font-size:12px;color:#667085}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#a15c00}.bad{background:#fef3f2;color:#b42318}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#edf2ff;color:#2444a3;font-size:11px;margin:2px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #dfe5ee;padding:8px;text-align:center}th{background:#eef3f8}.alert{padding:10px;border-radius:9px;margin:8px 0}button{padding:10px 14px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.scroll{overflow:auto}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap">
<div class="hero"><h1>لوحة إدارة حجز الجداول</h1><p>الحجوزات الحية من قاعدة المدرسة. يتم تحديث الصفحة تلقائيًا.</p></div>
<div id="message"></div>
<div id="stats" class="grid"></div>
<div class="card"><div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap"><h2>حالة المعلمين</h2><button id="refresh">تحديث الآن</button></div><div class="scroll"><table><thead><tr><th>المعلم</th><th>المطلوب</th><th>المحجوز</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="card"><h2>الحجوزات الحالية</h2><div class="scroll"><table><thead><tr><th>اليوم</th><th>الحصة</th><th>المعلم</th><th>الفصل</th><th>المادة</th></tr></thead><tbody id="bookings"></tbody></table></div></div>
</div>
<script>
const API='https://yqbhxeotqbyygbntazws.supabase.co/functions/v1/booking-api';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){try{const r=await fetch(API+'?action=overview');const b=await r.json();if(!r.ok)throw new Error(b.error||'تعذر التحميل');const counts={};for(const x of b.bookings||[])counts[x.teacher_id]=(counts[x.teacher_id]||0)+1;const rows=(b.teachers||[]).map(t=>({t,n:counts[t.id]||0}));$('stats').innerHTML=[['المعلمون',rows.length],['إجمالي المطلوب',rows.reduce((a,x)=>a+x.t.required_lessons,0)],['إجمالي المحجوز',rows.reduce((a,x)=>a+x.n,0)],['المكتملون',rows.filter(x=>x.n>=x.t.required_lessons).length]].map(x=>`<div class="card"><div class="stat">${x[1]}</div><div class="muted">${x[0]}</div></div>`).join('');$('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.t.name)}</td><td>${x.t.required_lessons}</td><td>${x.n}</td><td>${Math.max(0,x.t.required_lessons-x.n)}</td><td>${x.n>=x.t.required_lessons?'<span class="pill ok">مكتمل</span>':'<span class="pill warn">ناقص</span>'}</td></tr>`).join('');$('bookings').innerHTML=(b.bookings||[]).sort((a,b)=>a.day_name.localeCompare(b.day_name)||a.period-b.period).map(x=>`<tr><td>${esc(x.day_name)}</td><td>${x.period}</td><td>${esc(x.teacher?.name||'')}</td><td>${esc(x.class_name||'')}</td><td>${esc((b.assignments||[]).find(a=>a.id===x.assignment_id)?.subject||'')}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد حجوزات.</td></tr>';$('message').innerHTML='<div class="alert ok">✓ متصل بقاعدة البيانات.</div>'}catch(e){$('message').innerHTML=`<div class="alert bad">✕ ${esc(e.message)}</div>`}}
$('refresh').onclick=load;load();setInterval(load,5000);
</script></body></html>
